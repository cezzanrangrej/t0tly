user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout     65;
    keepalive_requests  100000;

    gzip on;
    gzip_types application/json text/plain;

    # Rate-limit zone for /shorten: 10 req/min per IP (second layer after Redis)
    limit_req_zone $binary_remote_addr zone=shorten_limit:10m rate=10r/m;

    # Experiment 7: In-memory microcache for hot 302 redirects (10s TTL)
    proxy_cache_path /dev/shm/nginx_cache levels=1:2 keys_zone=redir_cache:50m inactive=30s max_size=100m;

    # Three API replicas — least_conn for even distribution
    upstream api {
        least_conn;
        server api1:8000 max_fails=0 fail_timeout=0s;
        server api2:8000 max_fails=0 fail_timeout=0s;
        server api3:8000 max_fails=0 fail_timeout=0s;
        keepalive 1024;
    }

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';

    # Suppress per-request logs on the high-volume redirect path
    map $uri $loggable {
        "~^/[A-Za-z0-9]{7}$"  0;
        default              1;
    }
    access_log /var/log/nginx/access.log main if=$loggable;

    server {
        listen 80 default_server reuseport backlog=16384;
        server_name _;

        location /health {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        location /ready {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        location /metrics {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # Rate-limited create endpoint
        location /shorten {
            limit_req        zone=shorten_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # Hot redirect path (ORIGIN PASS-THROUGH: microcache disabled for origin benchmarks)
        location / {
            # proxy_cache            redir_cache;
            # proxy_cache_key        $uri;
            # proxy_cache_valid      301 302 10s;
            # proxy_cache_use_stale  error timeout updating;
            # proxy_cache_lock       on;
            # add_header             X-Cache-Status $upstream_cache_status;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffering    on;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
        }
    }
}
